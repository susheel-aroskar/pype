[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pype-client"
version = "0.1.0"
description = "Synchronous, blocking client library for the pype rendezvous server."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "pype-server",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "types-requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
